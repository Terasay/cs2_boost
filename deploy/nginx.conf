limit_req_zone $binary_remote_addr zone=cs2_requests:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=cs2_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=cs2_connections:10m;

server {
    listen 80;
    listen [::]:80;
    server_name 194.238.42.45;
    server_tokens off;
    client_max_body_size 32k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn cs2_connections 30;
    limit_req_status 429;

    location ~ /\. {
        deny all;
    }

    location / {
        limit_req zone=cs2_requests burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/auth/ {
        limit_req zone=cs2_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
